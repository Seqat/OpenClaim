name: Fetch Free Games Data

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
    # Run specifically on Thursdays at 15:20 and 15:50 UTC for weekly Epic Games rotation
    - cron: '20 15 * * 4'
    - cron: '50 15 * * 4'
  workflow_dispatch:

jobs:
  fetch-games:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fetch-games
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run backend pipeline
        run: |
          python backend/main.py

      - name: Commit and push updated games.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git status
          if [ -n "$(git status --porcelain games.json)" ]; then
            git add games.json
            git commit -m "chore: update games.json [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes in games.json to commit."
          fi

      - name: Report failure
        if: failure()
        run: echo "::error::Fetch pipeline failed - games.json korundu, güncellenmedi"
