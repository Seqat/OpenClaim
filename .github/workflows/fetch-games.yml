name: Fetch Free Games Data

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
    # Run specifically on Thursdays at 15:20 and 15:50 UTC for weekly Epic Games rotation
    - cron: '20 15 * * 4'
    - cron: '50 15 * * 4'
  workflow_dispatch:

jobs:
  fetch-games:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fetch-games
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-

      - name: Install Playwright Chromium with system dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Run backend pipeline
        run: python backend/main.py

      - name: Validate generated games.json schema
        run: python tests/test_games_json_schema.py

      - name: Commit and push updated games.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git status
          if [ -n "$(git status --porcelain games.json)" ]; then
            tmp_games=$(mktemp)
            cp games.json "$tmp_games"
            git checkout -- games.json
            git pull --rebase origin "${GITHUB_REF_NAME}"
            mv "$tmp_games" games.json
            if [ -n "$(git status --porcelain games.json)" ]; then
              git add games.json
              git commit -m "chore: update games.json [skip ci]"
              git push
            else
              echo "games.json already matches upstream after rebase."
            fi
          else
            echo "No changes in games.json to commit."
          fi

      - name: Report failure
        if: failure()
        run: echo "::error::Fetch pipeline failed - games.json korundu, güncellenmedi"
